<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>DO BO DO BO DI DÉ · Poema Rítmico</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', 'Consolas', monospace;
            padding: 16px;
        }

        .score-card {
            max-width: 750px;
            width: 100%;
            background: #fbf7e8;
            padding: 36px 28px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 0 2px #b48c5c inset;
            background-image: radial-gradient(circle at 30% 20%, #fff6e0 0%, #f2e6d0 100%);
        }

        h1 {
            font-size: clamp(2.2rem, 8vw, 3.8rem);
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #2e1b0e;
            text-align: center;
            text-shadow: 3px 3px 0 #d4b483;
            margin-bottom: 40px;
            word-break: break-word;
            border-bottom: 3px dashed #7a5a3a;
            padding-bottom: 22px;
            line-height: 1.3;
        }

        /* Container dos seletores */
        .selectors-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            margin: 20px 0 30px;
        }

        /* Cada linha com título e seletor */
        .selector-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px 20px;
            border-bottom: 1px dashed #b49470;
            padding-bottom: 20px;
        }

        .selector-row:last-of-type {
            border-bottom: none;
            padding-bottom: 0;
        }

        /* Título de cada seletor (DO, BO, DI, DÉ) */
        .selector-title {
            font-size: 3rem;
            font-weight: 700;
            color: #2e1b0e;
            text-shadow: 2px 2px 0 #d4b483;
            letter-spacing: 4px;
            min-width: 120px;
            background: #e3cfb5;
            padding: 8px 20px;
            border-radius: 50px;
            text-align: center;
            box-shadow: inset 0 1px 5px #f9efdd, 0 4px 0 #7b6048;
        }

        /* Seletor estilizado (dropdown) */
        .dice-select {
            background: #1e1e1e;
            border: 3px solid #c9af91;
            box-shadow: 0 4px 0 #4d3e2e, inset 0 0 0 2px #faeacb;
            color: #f7e7cf;
            font-size: 28px;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            padding: 12px 24px;
            border-radius: 50px;
            outline: none;
            cursor: pointer;
            transition: 0.1s ease;
            min-width: 140px;
            text-align: center;
            text-align-last: center;
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path fill="%23f7e7cf" d="M7 10l5 5 5-5z"/></svg>');
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 24px;
        }

        .dice-select:hover {
            background-color: #2b241c;
            border-color: #e3b074;
        }

        .dice-select:focus {
            border-color: #e3b074;
            box-shadow: 0 4px 0 #5d3f28, inset 0 0 0 2px #ffeac2, 0 0 0 3px #b3824e;
            background-color: #2b241c;
        }

        .dice-select option {
            background: #1e1e1e;
            color: #f7e7cf;
            font-size: 24px;
            text-align: center;
        }

        /* Botão para gerar valores aleatórios sem repetição */
        .generator-container {
            display: flex;
            justify-content: center;
            margin: 30px 0 25px;
        }

        .roll-btn {
            background: #2e241b;
            color: #f3e1c2;
            border: 3px solid #b4946a;
            border-radius: 50px;
            padding: 14px 32px;
            font-size: 1.5rem;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            box-shadow: 0 6px 0 #1a130e, 0 0 0 2px #ebd5b0 inset;
            cursor: pointer;
            transition: all 0.08s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            display: inline-flex;
            align-items: center;
            gap: 12px;
        }

        .roll-btn:hover {
            background: #3f3024;
            box-shadow: 0 4px 0 #1a130e, 0 0 0 2px #f5e3c8 inset;
            transform: translateY(2px);
        }

        .roll-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #1a130e, 0 0 0 2px #ebd5b0 inset;
        }

        /* POEMA - Destaque especial */
        .poema-container {
            margin: 30px 0 20px;
            padding: 24px 20px;
            background: #2d241b;
            border-radius: 24px;
            box-shadow: inset 0 0 0 3px #ebd5b0, 0 6px 0 #1a130e;
            border: 2px solid #b4946a;
        }

        .poema-linha {
            font-size: clamp(1.3rem, 4vw, 2rem);
            font-weight: 800;
            text-transform: uppercase;
            text-align: center;
            color: #f3e1c2;
            text-shadow: 2px 2px 0 #1a130e;
            letter-spacing: 6px;
            line-height: 1.6;
            word-break: break-word;
            font-family: 'Courier New', 'Consolas', monospace;
        }

        .poema-linha + .poema-linha {
            margin-top: 8px;
        }

        /* Rodapé / dicas */
        .edit-hint {
            text-align: center;
            color: #4b3926;
            margin-top: 24px;
            font-weight: bold;
            font-size: 1rem;
            border-top: 2px dashed #b49470;
            padding-top: 20px;
        }

        .small-note {
            font-style: italic;
            color: #35281c;
            font-size: 0.9rem;
        }

        /* Versão responsiva */
        @media (max-width: 550px) {
            .score-card {
                padding: 24px 16px;
            }

            .selector-title {
                font-size: 2.5rem;
                min-width: 100px;
                padding: 6px 16px;
            }

            .dice-select {
                font-size: 22px;
                padding: 10px 18px;
                min-width: 120px;
                background-position: right 12px center;
            }

            .selector-row {
                gap: 12px;
            }

            .roll-btn {
                font-size: 1.2rem;
                padding: 12px 24px;
            }

            .poema-linha {
                letter-spacing: 3px;
            }
        }

        @media (max-width: 400px) {
            .selector-row {
                flex-direction: column;
                align-items: flex-start;
            }

            .dice-select {
                width: 100%;
            }

            .poema-linha {
                font-size: 1.1rem;
                letter-spacing: 2px;
            }
        }
    </style>
</head>
<body>
<div class="score-card">
    <h1>DO BO DO BO DI DÉ</h1>

    <!-- QUATRO SELETORES -->
    <div class="selectors-container">
        <!-- DO -->
        <div class="selector-row">
            <div class="selector-title">DO</div>
            <select class="dice-select" id="select-do">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
        </div>

        <!-- BO -->
        <div class="selector-row">
            <div class="selector-title">BO</div>
            <select class="dice-select" id="select-bo">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
        </div>

        <!-- DI -->
        <div class="selector-row">
            <div class="selector-title">DI</div>
            <select class="dice-select" id="select-di">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
        </div>

        <!-- DÉ -->
        <div class="selector-row">
            <div class="selector-title">DÉ</div>
            <select class="dice-select" id="select-de">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
                <option value="5">5</option>
            </select>
        </div>
    </div>

    <!-- BOTÃO GERADOR RANDÔMICO (SEM REPETIÇÃO) -->
    <div class="generator-container">
        <button class="roll-btn" id="rollDiceBtn">
            <span>🎲</span> JOGAR DADOS <span>🎲</span>
        </button>
    </div>

    <!-- POEMA EM DESTAQUE -->
    <div class="poema-container">
        <div class="poema-linha">DO DO DO BO DI DI</div>
        <div class="poema-linha">DO BO DO BO DÉ DÉ</div>
        <div class="poema-linha">DO BO DI DO BO DÉ</div>
        <div class="poema-linha">DO BO DO BO DI DÉ</div>
    </div>

    <div class="edit-hint">
        ✎ DO · BO · DI · DÉ — valores únicos de 1 a 5<br>
        <span class="small-note">cada seletor recebe um número diferente · sem repetição</span>
    </div>
</div>

<script>
    (function() {
        // Referência aos quatro seletores
        const selectDo = document.getElementById('select-do');
        const selectBo = document.getElementById('select-bo');
        const selectDi = document.getElementById('select-di');
        const selectDe = document.getElementById('select-de');
        
        const selects = [selectDo, selectBo, selectDi, selectDe];
        
        // Função para gerar array com valores únicos aleatórios
        function gerarValoresUnicos() {
            // Array com todos os valores possíveis (1 a 5)
            const valoresDisponiveis = [1, 2, 3, 4, 5];
            const valoresEscolhidos = [];
            
            // Embaralhar o array (Fisher-Yates)
            for (let i = valoresDisponiveis.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [valoresDisponiveis[i], valoresDisponiveis[j]] = [valoresDisponiveis[j], valoresDisponiveis[i]];
            }
            
            // Pegar os primeiros 4 valores (já que temos 4 seletores)
            for (let i = 0; i < 4; i++) {
                valoresEscolhidos.push(valoresDisponiveis[i]);
            }
            
            return valoresEscolhidos;
        }
        
        // Função para atribuir valores únicos aos seletores
        function atribuirValoresUnicos() {
            const valores = gerarValoresUnicos();
            
            selects.forEach((select, index) => {
                if (select) {
                    select.value = valores[index];
                }
            });
        }
        
        // Botão "JOGAR DADOS"
        const rollBtn = document.getElementById('rollDiceBtn');
        if (rollBtn) {
            rollBtn.addEventListener('click', atribuirValoresUnicos);
        }
        
        // Gerar valores únicos automaticamente ao carregar a página
        window.addEventListener('DOMContentLoaded', function() {
            atribuirValoresUnicos();
        });
        
        console.log("🎲 DO BO DO BO DI DÉ — Com poema rítmico!");
    })();
</script>
</body>
</html>
